<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="19" fill="#EF8B17" stroke="#B33800" stroke-width="2"/>
  
  <!-- Building/Construction icon -->
  <g transform="translate(8, 8)">
    <!-- Main building structure -->
    <rect x="6" y="4" width="12" height="16" fill="#FFFFFF" stroke="#B33800" stroke-width="1"/>
    
    <!-- Foundation/base -->
    <rect x="4" y="18" width="16" height="3" fill="#B33800"/>
    
    <!-- Windows -->
    <rect x="8" y="7" width="2" height="2" fill="#EF8B17"/>
    <rect x="12" y="7" width="2" height="2" fill="#EF8B17"/>
    <rect x="8" y="11" width="2" height="2" fill="#EF8B17"/>
    <rect x="12" y="11" width="2" height="2" fill="#EF8B17"/>
    
    <!-- Door -->
    <rect x="10" y="15" width="2" height="3" fill="#B33800"/>
    
    <!-- Roof -->
    <polygon points="5,4 12,1 19,4" fill="#B33800"/>
    
    <!-- Small engineering elements -->
    <circle cx="3" cy="10" r="1.5" fill="#EF8B17"/>
    <circle cx="21" cy="10" r="1.5" fill="#EF8B17"/>
    
    <!-- Measurement lines -->
    <line x1="2" y1="6" x2="2" y2="16" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="22" y1="6" x2="22" y2="16" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
</svg>
