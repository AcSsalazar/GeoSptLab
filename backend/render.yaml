# Render Blueprint specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: geosptlab-backend
    env: python
    region: oregon  # or your preferred region
    plan: free  # or starter, standard, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geosptlab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend-domain.vercel.app", "https://geosptlab.tech"]'

databases:
  - name: geosptlab-db
    plan: free  # or starter, standard, etc.
    databaseName: geosptlab
    user: geosptlab_user
